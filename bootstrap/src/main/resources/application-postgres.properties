# Spring profile "postgres" (P09): rosters are stored in PostgreSQL instead of memory.
# Values come from the environment; scripts/run-api-postgres.ps1 loads them from the repo-root
# .env (never committed). No password is stored here.
rota.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rota}
rota.datasource.username=${POSTGRES_USER:rota}
rota.datasource.password=${POSTGRES_PASSWORD:}
