spring.application.name=rota
server.port=8080

# Fixtures folder. Blank: walk up from the working directory to the first fixtures/ folder.
rota.fixtures-dir=

# Solver termination, ISO-8601 durations. Same as new RosterSolver() used by the solver tests.
rota.solver.spent-limit=PT30S
rota.solver.unimproved-spent-limit=PT3S

# Web demo origin allowed to call /api/** from the browser (CORS). Comma-separated list accepted.
rota.web.origin=http://localhost:3000
